# Builds KeePassXC for Windows in GitHub Actions.
#
# Upstream has no Actions-based Windows build -- releases come from other
# infrastructure -- so this exists to answer one question before anything else
# is designed around it: can a patched KeePassXC be built and then tested in the
# same run? Without that, "fix it and verify the fix" can only ever be
# demonstrated with a stand-in binary, which is not the same claim.
#
# Build only, on purpose. The verification workflow stays separate until this
# one is green.
name: Build KeePassXC (Windows)

# Manual only, and cancelling its own earlier runs. Every push to the branch was
# starting a fresh hour-long build, so three of them ran at once while the tests
# were still being fixed -- the tests are what the pushes were for.
on:
  workflow_dispatch:

concurrency:
  group: keepassxc-windows-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.1

jobs:
  build:
    name: build x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # aqtinstall rather than a third-party action: one less thing to trust in
      # a repository that is not mine, and the version is pinned here.
      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pip install aqtinstall
          $arch = 'win64_msvc2022_64'

          # Printed, not assumed: `-m qtsvg` failed with "The packages ['qtsvg']
          # were not found while parsing XML of package information", and
          # guessing module names again would just move the guess.
          Write-Host "--- modules available for $env:QT_VERSION $arch"
          aqt list-qt windows desktop --modules $env:QT_VERSION $arch

          aqt install-qt windows desktop $env:QT_VERSION $arch -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "aqt install-qt failed with $LASTEXITCODE" }
          $prefix = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          if (-not (Test-Path $prefix)) { throw "Qt did not land at $prefix" }

          # KeePassXC needs Core Network Concurrent Gui Svg Widgets Test
          # LinguistTools. Whether Svg ships in the base package or as a module
          # is decided by looking for its CMake config rather than by belief.
          $svg = Get-ChildItem $prefix -Recurse -Filter 'Qt6SvgConfig.cmake' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $svg) {
            Write-Host "Svg not in the base package; installing the module"
            aqt install-qt windows desktop $env:QT_VERSION $arch -m qtsvg -O C:\Qt
            $svg = Get-ChildItem $prefix -Recurse -Filter 'Qt6SvgConfig.cmake' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          }
          if (-not $svg) {
            throw "no Qt6SvgConfig.cmake under $prefix; see the module list printed above"
          }
          Write-Host "Svg config: $($svg.FullName)"

          foreach ($component in 'Core','Network','Concurrent','Gui','Svg','Widgets','Test') {
            $found = Test-Path (Join-Path $prefix "lib\cmake\Qt6$component")
            Write-Host "  Qt6$component present: $found"
          }
          "QT_PREFIX=$prefix" >> $env:GITHUB_ENV

      # The runner ships vcpkg; the repo is in manifest mode, so configure
      # installs what vcpkg.json asks for.
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path $vcpkg)) { throw "no vcpkg toolchain at $vcpkg" }
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DWITH_TESTS=OFF `
            -DWITH_XC_AUTOTYPE=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with $LASTEXITCODE" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed with $LASTEXITCODE" }
          Get-ChildItem build -Recurse -Filter "KeePassXC.exe" | ForEach-Object {
            Write-Host "built: $($_.FullName)  $([math]::Round($_.Length / 1MB, 1)) MB"
          }

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepassxc-windows-x64
          path: |
            build/src/KeePassXC.exe
            build/src/keepassxc-cli.exe
          if-no-files-found: warn
          retention-days: 7
