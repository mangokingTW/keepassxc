# Builds KeePassXC for Windows in GitHub Actions.
#
# Upstream has no Actions-based Windows build -- releases come from other
# infrastructure -- so this exists to answer one question before anything else
# is designed around it: can a patched KeePassXC be built and then tested in the
# same run? Without that, "fix it and verify the fix" can only ever be
# demonstrated with a stand-in binary, which is not the same claim.
#
# Build only, on purpose. The verification workflow stays separate until this
# one is green.
name: Build KeePassXC (Windows)

# Manual only, and cancelling its own earlier runs. Every push to the branch was
# starting a fresh hour-long build, so three of them ran at once while the tests
# were still being fixed -- the tests are what the pushes were for.
on:
  workflow_dispatch:

concurrency:
  group: keepassxc-windows-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.1

jobs:
  build:
    name: build x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # aqtinstall rather than a third-party action: one less thing to trust in
      # a repository that is not mine, and the version is pinned here.
      # Both caches exist because a cold run costs about an hour -- Qt a couple
      # of minutes, vcpkg's botan the rest -- and the point of this workflow is
      # to iterate on a patch.
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pip install aqtinstall
          $arch = 'win64_msvc2022_64'

          # Printed, not assumed: `-m qtsvg` failed with "The packages ['qtsvg']
          # were not found while parsing XML of package information", and
          # guessing module names again would just move the guess.
          Write-Host "--- modules available for $env:QT_VERSION $arch"
          aqt list-qt windows desktop --modules $env:QT_VERSION $arch

          aqt install-qt windows desktop $env:QT_VERSION $arch -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "aqt install-qt failed with $LASTEXITCODE" }
          $prefix = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          if (-not (Test-Path $prefix)) { throw "Qt did not land at $prefix" }

          # KeePassXC needs Core Network Concurrent Gui Svg Widgets Test
          # LinguistTools. Whether Svg ships in the base package or as a module
          # is decided by looking for its CMake config rather than by belief.
          $svg = Get-ChildItem $prefix -Recurse -Filter 'Qt6SvgConfig.cmake' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $svg) {
            Write-Host "Svg not in the base package; installing the module"
            aqt install-qt windows desktop $env:QT_VERSION $arch -m qtsvg -O C:\Qt
            $svg = Get-ChildItem $prefix -Recurse -Filter 'Qt6SvgConfig.cmake' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          }
          if (-not $svg) {
            throw "no Qt6SvgConfig.cmake under $prefix; see the module list printed above"
          }
          Write-Host "Svg config: $($svg.FullName)"

          foreach ($component in 'Core','Network','Concurrent','Gui','Svg','Widgets','Test') {
            $found = Test-Path (Join-Path $prefix "lib\cmake\Qt6$component")
            Write-Host "  Qt6$component present: $found"
          }
          "QT_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Export the Qt prefix
        shell: pwsh
        run: |
          $prefix = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          if (-not (Test-Path $prefix)) { throw "no Qt at $prefix (cache hit but nothing there?)" }
          "QT_PREFIX=$prefix" >> $env:GITHUB_ENV
          Write-Host "Qt prefix: $prefix"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          # The triplet is in the key: switching between the static and dynamic
          # CRT produces different binaries under the same manifest.
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      # The runner ships vcpkg; the repo is in manifest mode, so configure
      # installs what vcpkg.json asks for.
      - name: Configure and build with MSVC
        shell: pwsh
        run: |
          # One step, and inside VsDevCmd: see the header of the script for what
          # went wrong when CMake was left to pick a compiler.
          cmd /c ".github\scripts\build-keepassxc-msvc.bat x64"
          if ($LASTEXITCODE -ne 0) { throw "the build script failed with $LASTEXITCODE" }
          $exe = Get-ChildItem build -Recurse -Filter 'KeePassXC.exe' | Select-Object -First 1
          if (-not $exe) { throw "no KeePassXC.exe under build/" }
          Write-Host "built: $($exe.FullName)  $([math]::Round($exe.Length / 1MB, 1)) MB"

      # A bare KeePassXC.exe cannot run: the dependencies are dynamic now, so Qt
      # and the vcpkg libraries have to travel with it. Without this the artifact
      # is only useful for proving that the tree compiles.
      - name: Stage a runnable bundle
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $exe = Get-ChildItem build -Recurse -Filter 'KeePassXC.exe' | Select-Object -First 1
          if (-not $exe) { throw "no KeePassXC.exe to stage" }
          Copy-Item $exe.FullName $stage
          Get-ChildItem build -Recurse -Filter 'keepassxc-cli.exe' |
            Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName $stage }

          # The helper, signed by the step above, so the bundle can exercise the
          # delegated path where it is needed.
          if ($env:CREDUI_UIACCESS_HELPER -and (Test-Path $env:CREDUI_UIACCESS_HELPER)) {
            Copy-Item $env:CREDUI_UIACCESS_HELPER (Join-Path $stage 'keepassxc-uiaccess-helper.exe')
          }

          & "$env:QT_PREFIX\bin\windeployqt.exe" --release --no-translations `
            --no-system-d3d-compiler --no-opengl-sw (Join-Path $stage 'KeePassXC.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with $LASTEXITCODE" }

          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg_installed\x64-windows\bin'
          if (Test-Path $vcpkgBin) {
            Copy-Item (Join-Path $vcpkgBin '*.dll') $stage -Force
          }

          $count = (Get-ChildItem $stage -Recurse -File | Measure-Object).Count
          $size = [math]::Round(((Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "staged $count files, $size MB"

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepassxc-windows-x64
          path: stage/
          if-no-files-found: warn
          retention-days: 7
